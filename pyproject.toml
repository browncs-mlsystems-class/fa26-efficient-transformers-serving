[project]
name = "efficientserving"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/efficientserving"]
